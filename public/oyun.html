// Ekranda ses ayarı/simgesi YOK; ses her zaman çalar. (Telefon tarayıcısı ilk dokunuşa kadar sesi kilitli tutar;
// ekranın herhangi bir yerine bir dokunuş yeter.) Ekran kilitlenip geri gelince ses kendiliğinden yeniden açılır.
addEventListener('DOMContentLoaded', () => sesHazirla());   // ayarlar (SES_*) aşağıdaki scriptte tanımlı
setInterval(() => { if (ses && ses.state !== 'running') ses.resume().catch(() => {}); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ses) ses.resume().catch(() => {}); });
// geçici teşhis: telefondaki ses durumu sunucuya bildirilir
function teshis(olay) {
  const cr = document.getElementById('c').getBoundingClientRect();
  const d = { sayfa: 'oyun', olay, ctx: ses ? ses.state : 'yok', dosya: !!sesTampon, sure: ses ? +ses.currentTime.toFixed(2) : 0, ekran: innerWidth + 'x' + innerHeight + '@' + devicePixelRatio, tuval: [cr.left, cr.top, cr.width, cr.height].map(Math.round).join(',') };
  try { fetch('/api/teshis?d=' + encodeURIComponent(JSON.stringify(d))); } catch {}
}
setTimeout(() => teshis('acilis'), 3000);
addEventListener('pointerdown', () => setTimeout(() => teshis('dokunus'), 300));
</script>
<script>

// Alt alan videosu: public/video/ içindeki dosya, sessiz ve döngüde. '' yaparsan alt alan şeffaf kalır (OBS'te kendi videonu koyarsın)

const TOPLU_EGRI = 0.8;                        // 0 = hep aynı hız, 0.9'a yaklaştıkça başta/sonda daha yavaş, ortada daha hızlı

const gorsel = {};             // id -> {img, meta, x, hedefX, sira, hedefSira, atil, halka, sonPuanlar[]}
let spriteMeta = {};
const ucanlar = [];            // avatar uçuşları
const resimOnbellek = new Map();
function resim(url) {
  if (!url) return null;
  if (resimOnbellek.has(url)) return resimOnbellek.get(url);
  const im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = url;
  resimOnbellek.set(url, im); return im;
}

// ---------- Arka plan (bir kez çizilir) ----------
const arka = document.createElement('canvas'); arka.width = W; arka.height = H;
function yuvarlak(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
// Gerçek oda: dokulu sıva duvar, sol üstten sıcak lamba ışığı, TV'nin mavi yansıması, ahşap TV sehpası
function gercekOdaCiz(c) {
  let tohum = 7; const rnd = () => ((tohum = (tohum * 16807) % 2147483647) / 2147483647);
  const MASA_ARKA = TV.y + TV.h - 26, MASA_ON = DUVAR_ALT - 24;
  // duvar zemini
  let g = c.createLinearGradient(0, 0, 0, MASA_ARKA);
  g.addColorStop(0, '#b89470'); g.addColorStop(.5, '#c9a47c'); g.addColorStop(1, '#a5815c');
  c.fillStyle = g; c.fillRect(0, 0, W, MASA_ARKA + 4);
  // sıva dokusu (ince gren + lekeler)
  const doku = document.createElement('canvas'); doku.width = doku.height = 256;
  const dc = doku.getContext('2d'), id = dc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
  dc.putImageData(id, 0, 0);
  c.save(); c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(doku, 'repeat'); c.fillRect(0, 0, W, MASA_ARKA); c.restore();
  c.save(); c.filter = 'blur(28px)';
  for (let i = 0; i < 26; i++) { c.fillStyle = rnd() < .5 ? 'rgba(255,240,215,.07)' : 'rgba(90,60,30,.06)'; c.beginPath(); c.arc(rnd() * W, rnd() * MASA_ARKA, 40 + rnd() * 110, 0, Math.PI * 2); c.fill(); }
  c.restore();
  // sol üstteki lambanın sıcak ışığı
  c.save(); c.globalCompositeOperation = 'screen';
  g = c.createRadialGradient(W * 0.12, -40, 20, W * 0.12, -40, 900);
  g.addColorStop(0, 'rgba(255,205,140,.55)'); g.addColorStop(.45, 'rgba(255,180,110,.18)'); g.addColorStop(1, 'rgba(255,170,100,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, MASA_ARKA);
  // açık TV'nin duvara vuran soğuk mavi ışığı
  g = c.createRadialGradient(W / 2, TV.y + TV.h * 0.42, TV.w * 0.3, W / 2, TV.y + TV.h * 0.42, TV.w * 0.8);
  g.addColorStop(0, 'rgba(90,140,255,.22)'); g.addColorStop(1, 'rgba(90,140,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, MASA_ARKA); c.restore();
  // köşeler kararsın (oda derinliği)
  g = c.createRadialGradient(W * 0.45, TV.y + TV.h * 0.4, 300, W * 0.45, TV.y + TV.h * 0.4, 900);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(30,15,5,.55)');
  c.fillStyle = g; c.fillRect(0, 0, W, MASA_ARKA + 4);
  // duvar-masa birleşimindeki koyuluk
  g = c.createLinearGradient(0, MASA_ARKA - 40, 0, MASA_ARKA);
  g.addColorStop(0, 'rgba(30,15,5,0)'); g.addColorStop(1, 'rgba(30,15,5,.45)');
  c.fillStyle = g; c.fillRect(0, MASA_ARKA - 40, W, 40);
  // masa üstü (perspektifli ceviz)
  c.save(); c.beginPath(); c.moveTo(-20, MASA_ARKA); c.lineTo(W + 20, MASA_ARKA); c.lineTo(W + 60, MASA_ON); c.lineTo(-60, MASA_ON); c.closePath(); c.clip();
  g = c.createLinearGradient(0, MASA_ARKA, 0, MASA_ON);
  g.addColorStop(0, '#4a2e18'); g.addColorStop(1, '#6e4626');
  c.fillStyle = g; c.fillRect(-60, MASA_ARKA, W + 120, MASA_ON - MASA_ARKA);
  for (let i = 0; i < 60; i++) {           // ahşap damarları
    const y = MASA_ARKA + rnd() * (MASA_ON - MASA_ARKA), x = rnd() * W;
    c.strokeStyle = rnd() < .5 ? 'rgba(30,14,4,.35)' : 'rgba(150,100,60,.18)'; c.lineWidth = .8 + rnd() * 1.6;
    c.beginPath(); c.moveTo(x - 200 - rnd() * 300, y); c.quadraticCurveTo(x, y + (rnd() - .5) * 6, x + 200 + rnd() * 300, y + (rnd() - .5) * 4); c.stroke();
  }
  // lamba ışığının masadaki parlaması
  g = c.createRadialGradient(W * 0.2, MASA_ON, 10, W * 0.2, MASA_ON, 520);
  g.addColorStop(0, 'rgba(255,210,160,.22)'); g.addColorStop(1, 'rgba(255,210,160,0)');
  c.fillStyle = g; c.fillRect(-60, MASA_ARKA, W + 120, MASA_ON - MASA_ARKA);

  c.fillStyle = 'rgba(255,215,170,.30)'; c.fillRect(0, MASA_ON, W, 2);

// TV ekranındaki görüntüye kontrast/doygunluk: referans videodaki gibi siyahlar daha derin, renkler daha canlı.
// Her karede değil, açılışta bir kez uygulanır (ekran arka planı + hayvan görselleri): performans kaybı yok
const EKRAN_KONTRAST = 1.22;    // 1 = değişiklik yok. Büyüdükçe koyular koyulaşır, parlaklar parlar
const EKRAN_DOYGUNLUK = 1.15;   // 1 = değişiklik yok. Büyüdükçe renkler canlanır
const EKRAN_PARLAKLIK = 0.97;   // 1 = değişiklik yok
const EKRAN_FILTRE = `contrast(${EKRAN_KONTRAST}) saturate(${EKRAN_DOYGUNLUK}) brightness(${EKRAN_PARLAKLIK})`;
// Hayvan görselleri ekranda en fazla ~150 px boyunda çiziliyor ama kaynak kareler 220-245 px.
// Kopya %60 boyda tutulur: bellek ~3 kat azalır, her karede çizim hızlanır (yayında donmayı azaltır), görüntü farkı yok.
const HAYVAN_KOPYA_OLCEK = 0.6;
function hayvanKopya(g, hedef = null) {   // kontrastlı, parlaklığı ayarlı ve küçültülmüş sprite kopyası
  const m = g.meta, sut = m.sutun || m.kare;
  const fw = Math.round(m.w * HAYVAN_KOPYA_OLCEK), fh = Math.round(m.h * HAYVAN_KOPYA_OLCEK);   // kare boyu tam sayı: kareler birbirine taşmaz
  const satir = Math.round(g.img.naturalHeight / m.h);
  const c = hedef || document.createElement('canvas'); c.width = fw * sut; c.height = fh * satir;
  const k = c.getContext('2d'); k.clearRect(0, 0, c.width, c.height); k.imageSmoothingQuality = 'high';
  k.filter = EKRAN_FILTRE + (YER.hayvanParlak !== 1 ? ` brightness(${YER.hayvanParlak})` : '');
  k.drawImage(g.img, 0, 0, m.w * sut, m.h * satir, 0, 0, c.width, c.height);
  g.kw = fw; g.kh = fh; return c;
}
function filtreliKopya(kaynak, w, h, parlak = 1, hedef = null) {   // görselin kontrastlı (ve istenirse parlaklığı ayarlı) kopyası
  const c = hedef || document.createElement('canvas'); c.width = w; c.height = h;
  const k = c.getContext('2d'); k.clearRect(0, 0, w, h); k.filter = EKRAN_FILTRE + (parlak !== 1 ? ` brightness(${parlak})` : ''); k.drawImage(kaynak, 0, 0); return c;
}
// Hayvan parlaklığı panelden değişince hayvan görselleri yeniden hazırlanır (her karede filtre çalışmasın diye)
let _hayvanZaman = null;
function hayvanlariYenile() {
  clearTimeout(_hayvanZaman);
  _hayvanZaman = setTimeout(() => {
    for (const g of Object.values(gorsel)) if (g.img.complete && g.img.naturalWidth) {
      try { g.kontrastli = hayvanKopya(g, g.kontrastli); } catch {}
    }
  }, 250);
}
function arkaCiz() {
  const c = arka.getContext('2d');
  c.clearRect(0, 0, W, H);
  let g;
  if (SAHNE) {
    // odadaki büyük TV fotoğrafı: oda zaten fotoğrafta, olduğu gibi bas
    if (tvFoto.complete && tvFoto.naturalWidth) c.drawImage(tvFoto, 0, 0, W, SAHNE.h);
  } else if (TV_STIL === 'foto') {
    gercekOdaCiz(c);
    // gerçek TV fotoğrafı: duvara düşen yumuşak gölge (ışık sol üstten) + masaya oturduğu yerde koyu temas gölgesi
    if (tvFoto.complete && tvFoto.naturalWidth) {
      // odanın sıcak ışığı TV'ye de vursun (fotoğraf soğuk kalmasın): ayrı tuvalde renklendir
      const t = document.createElement('canvas'); t.width = Math.round(TV.w); t.height = Math.round(TV.h);
      const tc = t.getContext('2d'); tc.drawImage(tvFoto, 0, 0, t.width, t.height);
      tc.globalCompositeOperation = 'source-atop';
      g = tc.createLinearGradient(0, 0, t.width, t.height);
      g.addColorStop(0, 'rgba(255,200,140,.10)'); g.addColorStop(1, 'rgba(40,20,5,.14)');
      tc.fillStyle = g; tc.fillRect(0, 0, t.width, t.height);
      c.save(); c.shadowColor = 'rgba(25,12,4,.55)'; c.shadowBlur = 70; c.shadowOffsetX = 26; c.shadowOffsetY = 22;
      c.drawImage(t, TV.x, TV.y, TV.w, TV.h); c.restore();
      c.save(); c.filter = 'blur(9px)'; c.fillStyle = 'rgba(10,5,2,.75)';
      c.fillRect(TV.x + 50, TV.y + TV.h - 10, TV.w - 100, 22); c.restore();
      c.drawImage(t, TV.x, TV.y, TV.w, TV.h);
    }
  } else {
  // duvar (sıcak bej, ortası aydınlık)
  g = c.createRadialGradient(W / 2, TV.y + TV.h * 0.45, 80, W / 2, TV.y + TV.h * 0.45, 820);
  g.addColorStop(0, '#d8b77c'); g.addColorStop(.55, '#b8935a'); g.addColorStop(1, '#6e5330');
  c.fillStyle = g; c.fillRect(0, 0, W, DUVAR_ALT);
  // ahşap sehpa
  const SY = TV.y + TV.h - 14;
  g = c.createLinearGradient(0, SY, 0, DUVAR_ALT);
  g.addColorStop(0, '#5a3d22'); g.addColorStop(.18, '#3d2914'); g.addColorStop(1, '#24170b');
  c.fillStyle = g; c.beginPath(); c.moveTo(TV.x + 40, SY); c.lineTo(TV.x + TV.w - 40, SY); c.lineTo(TV.x + TV.w + 10, DUVAR_ALT); c.lineTo(TV.x - 10, DUVAR_ALT); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,220,170,.10)'; c.fillRect(TV.x + 40, SY, TV.w - 80, 6);
  // TV gölgesi
  c.save(); c.shadowColor = 'rgba(0,0,0,.65)'; c.shadowBlur = 50; c.shadowOffsetY = 18;
  c.fillStyle = '#111'; yuvarlak(c, TV.x, TV.y, TV.w, TV.h, TV.r); c.fill(); c.restore();
  // TV kasası (koyu plastik, üstten hafif ışık)
  g = c.createLinearGradient(0, TV.y, 0, TV.y + TV.h);
  g.addColorStop(0, '#3c3c3e'); g.addColorStop(.08, '#2a2a2c'); g.addColorStop(.85, '#1a1a1b'); g.addColorStop(1, '#0e0e0f');
  c.fillStyle = g; yuvarlak(c, TV.x, TV.y, TV.w, TV.h, TV.r); c.fill();
  // kasa kenar parlaması
  c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 3; yuvarlak(c, TV.x + 2, TV.y + 2, TV.w - 4, TV.h - 4, TV.r - 2); c.stroke();
  // ekran çevresindeki iç çerçeve (tüp yuvası)
  g = c.createLinearGradient(0, EKRAN.y - 18, 0, EKRAN.y + EKRAN.h + 18);

// ---------- Sıralama ve konum ----------
function hedefleriHesapla() {
  const sirali = [...seritler].sort((a, b) => b.puan - a.puan || (gorsel[a.id]?.hedefSira ?? 0) - (gorsel[b.id]?.hedefSira ?? 0));
  const lider = sirali[0] ? sirali[0].puan : 0;
  // lider ilk puanlarda yavaşça öne çıkar, sonra en önde sabit kalır (oyunun sonu yok)
  const liderX = lider > 0 ? BURUN_MIN + (BURUN_MAX - BURUN_MIN) * (1 - Math.exp(-lider / 15)) : BURUN_MIN;
  sirali.forEach((s, i) => {
    const g = gorsel[s.id]; if (!g) return;
    g.hedefSira = i;
    // fark az -> boşluk az, fark çok -> boşluk çok
    const oran = lider > 0 ? (s.puan + YUMUSAT) / (lider + YUMUSAT) : 1;
    g.hedefX = BURUN_MIN + (liderX - BURUN_MIN) * oran;
  });
}

// Toplu hediye (+10, +50, TikTok kombosu) tek tek jeton gibi oynar: her biri ayrı avatar + ayrı tap-tik,

const AVATAR_EN_FAZLA = 100;   // tek seferde en fazla kaç avatar (fazlası direkt puana eklenir)

  const g = gorsel[m.serit]; if (!g) return;
  const adet = Math.max(0, Math.min(m.miktar, AVATAR_EN_FAZLA));
  bekleyen[m.serit] = (bekleyen[m.serit] || 0) + adet;
  const s = seritler.find(x => x.id === m.serit); if (s) s.puan = Math.max(0, m.puan - bekleyen[m.serit]);
  hedefleriHesapla();

  const sonBas = ucanlar.filter(u => u.id === m.serit).reduce((a, u) => Math.max(a, u.bas), simdi - AVATAR_ARALIK);

  // Az hediyede (6 ve altı) eskisi gibi eşit aralıkla.
  const toplam = adet <= 6 ? adet * AVATAR_ARALIK : Math.min(adet * AVATAR_ARALIK, TOPLU_TABAN + adet * TOPLU_ADET);

  for (let i = 0; i < adet; i++) {

    ucanlar.push({ id: m.serit, bas, sure: AVATAR_SURE, foto: resim(m.kullanici && m.kullanici.foto), sayar: true });
    // tık sesi tam değme anında. Çok hızlı akışta (ortada) her değmeye ayrı tık sığmaz, tıklar üst üste binip
    // ritim bozulur: o yüzden en az TIK_EN_AZ ms arayla çalar. Böylece ses de görüntü gibi yavaş-hızlı-yavaş akar.
    if (varis - sonTikZamani >= TIK_EN_AZ || i === adet - 1) { tik(varis - simdi); sonTikZamani = varis; }
  }
}

  if (CANLI) cx.filter = `hue-rotate(${(simdi / 30) % 360}deg) saturate(1.4)` + (YER.cizgiParlak !== 1 ? ` brightness(${YER.cizgiParlak})` : '');
  else if (YER.cizgiParlak !== 1) cx.filter = `brightness(${YER.cizgiParlak})`;
  for (let i = 1; i < 5; i++) cizgi(cx, EKRAN.y + SERIT_H * i, kayma);
  cizgi(cx, EKRAN.y + EKRAN.h - 3, kayma);
  cx.filter = 'none';
  // rozetler
  const rozetSag = {};
  for (const { s, y } of satirlar) rozetSag[s.id] = rozetCiz(s, y);
  // avatar uçuşları
  for (let i = ucanlar.length - 1; i >= 0; i--) {
    const u = ucanlar[i], g = gorsel[u.id]; const sat = satirlar.find(r => r.s.id === u.id);
    if (!g || !sat) { if (u.sayar && bekleyen[u.id] > 0) bekleyen[u.id]--; ucanlar.splice(i, 1); continue; }
    const p = (simdi - u.bas) / u.sure; if (p < 0) continue;
    if (p >= 1) {
      ucanlar.splice(i, 1); g.atil = Math.min(28, g.atil + 14); if (g.hedefSira === 0) g.buyu = Math.min(LIDER_BUYUME_MAX, g.buyu + LIDER_BUYUME);
      // değdi: sayaç 1 artar, hayvan bir tık ilerler
      if (u.sayar && bekleyen[u.id] > 0) { bekleyen[u.id]--; sat.s.puan++; hedefleriHesapla(); }
      if (CANLI) {   // değme anı: renkli kıvılcım patlaması + uçan "+1"
        const renk = RENK[u.id] || '#8fd0f5', vx = g.x - (g.meta.w * (SERIT_H * HAYVAN_BOY) / g.meta.h) * 0.25;
        parcaEkle(vx, sat.y, renk, 12, 520, 5, 520); parcaEkle(vx, sat.y, '#fff6c8', 6, 380, 3.5, 420);
        if (yazilar.length < 25) yazilar.push({ x: vx, y: sat.y - SERIT_H * .2, yas: 0, renk });
      }
      g.son = g.son.filter(t => simdi - t < 1500); g.son.push(simdi);
      if (g.son.length >= 3) g.halka = simdi;   // seri gelirse parlama halkası
      continue;
    }
    const e = p < .25 ? 0 : (p - .25) / .75, ee = e * e * (3 - 2 * e);
    const bas = rozetSag[u.id] + 44, son = g.x - (g.meta.w * (SERIT_H * HAYVAN_BOY) / g.meta.h) * 0.25;
    const alfa = p < .1 ? p / .1 : (p > .9 ? (1 - p) / .1 : 1);
    avatarCiz(bas + (son - bas) * ee, sat.y, AVATAR_BOY, u.foto, alfa);
  }
  cx.restore();
  cx.drawImage(cam, 0, 0);
  cx.restore();
  requestAnimationFrame(kare);
}

// ---------- Sunucu bağlantısı ----------
function sesAyarUygula(s) {
  if (Number.isFinite(s.tik)) SES_SEVIYE = s.tik;
  if (Number.isFinite(s.gecikme)) SES_KAYMA = s.gecikme;
  if (Number.isFinite(s.muzik) && typeof muzikSeviyeAyarla === 'function') muzikSeviyeAyarla(s.muzik);
}
function soket() {
  const ws = new WebSocket('ws://' + location.host + '/?rol=oyun');
  window.oyunSoket = ws;   // muzik.js müzik durumunu panele bu bağlantıyla bildirir
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.ses) sesAyarUygula(m.ses);   // panelden ses ayarı (durum ve 'ses' mesajlarında gelir)
    if (m.yer) {   // panelden yerleşim
      const eskiOda = YER.odaParlak, eskiHayvan = YER.hayvanParlak;
      for (const k of Object.keys(YER)) if (Number.isFinite(m.yer[k])) YER[k] = m.yer[k];
      if (YER.odaParlak !== eskiOda) arkaCiz();   // oda parlaklığı arka plana bir kez işlenir
      if (YER.hayvanParlak !== eskiHayvan) hayvanlariYenile();
    }
    if (m.tip === 'durum') {
      const ilk = !seritler.length;
      seritler = m.seritler.map(s => ({ ...s }));
      // henüz hayvana ulaşmamış avatarların puanı, değdikçe eklenecek
      for (const s of seritler) {
        const b = bekleyen[s.id] || 0;
        if (s.puan < b) { bekleyen[s.id] = 0; for (const u of ucanlar) if (u.id === s.id) u.sayar = false; }   // sıfırlandıysa bekleyenleri sayma
        else s.puan -= b;
      }
      hedefleriHesapla();
      if (ilk) for (const g of Object.values(gorsel)) if (g.hedefX !== undefined) { g.x = g.hedefX; g.sira = g.hedefSira; }
    }
    else if (m.tip === 'hediye') { hediyeGeldi(m); teshis('hediye'); }
  };
  ws.onclose = () => setTimeout(soket, 1500);
}

(async () => {
  arkaCiz();
  if (tvFoto && !tvFoto.complete) tvFoto.onload = arkaCiz;
  await spritelariYukle();
  soket();
  requestAnimationFrame(kare);
})();
</script>
